name: Build Hebrew Zed (Windows x64)

on:
  workflow_dispatch:
    inputs:
      zed_ref:
        description: "Upstream Zed commit SHA (empty = the one pinned in translations/manifest.json)"
        required: false
        default: ""
      variant:
        description: "hebrew = translated build, vanilla = untouched upstream (for comparison)"
        type: choice
        options: [hebrew, vanilla]
        default: hebrew
      bidi_wrap:
        description: "Wrap Hebrew strings in RLE..PDF (right-to-left paragraph behaviour)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CARGO_INCREMENTAL: "0"
      # The D: drive on GitHub's Windows runners has far more free space than C:
      CARGO_TARGET_DIR: D:\zed-target
      # Smaller and faster to link; this is an experimental build, not a release
      CARGO_PROFILE_RELEASE_FAST_DEBUG: "0"
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4
        with:
          path: hebrew

      - name: Fetch upstream Zed at the pinned commit
        shell: pwsh
        run: |
          $manifest = Get-Content hebrew/translations/manifest.json -Raw | ConvertFrom-Json
          $ref = "${{ github.event.inputs.zed_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = $manifest.upstream_commit }
          Write-Host "Zed commit: $ref"
          git init zed
          git -C zed remote add origin "https://github.com/$($manifest.upstream_repo).git"
          git -C zed fetch --depth 1 origin $ref
          git -C zed checkout FETCH_HEAD
          "ZED_SHA=$(git -C zed rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Hebrew translations
        if: github.event.inputs.variant != 'vanilla'
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ github.event.inputs.bidi_wrap }}" -eq "true") { $extra += "--bidi-wrap" }
          python hebrew/scripts/apply_strings.py --root zed --manifest hebrew/translations/manifest.json @extra

      - name: Apply code patches
        if: github.event.inputs.variant != 'vanilla'
        shell: pwsh
        run: |
          foreach ($patch in Get-ChildItem hebrew/patches -Filter *.patch | Sort-Object Name) {
            Write-Host "Applying $($patch.Name)"
            git -C zed apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch $($patch.Name) does not apply to this Zed commit" }
          }

      - name: Make sure the Spectre-mitigated MSVC libraries are installed
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $found = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory -Recurse -Filter spectre -Depth 3 -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "Spectre libs present: $($found[0].FullName)"
          } else {
            Write-Host "Installing Spectre libs"
            Start-Process -Wait -FilePath "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList "modify","--installPath","`"$vs`"","--add","Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre","--quiet","--norestart","--nocache"
          }

      - name: Install the Rust toolchain pinned by Zed
        working-directory: zed
        run: rustup show

      - name: Build zed.exe
        working-directory: zed
        run: cargo build --profile release-fast --package zed

      - name: Smoke test (launch Zed, drive the panels, take screenshots)
        continue-on-error: true
        shell: pwsh
        run: ./hebrew/scripts/smoke.ps1 -Exe "$env:CARGO_TARGET_DIR\release-fast\zed.exe" -Out smoke

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.event.inputs.variant }}-bidi-${{ github.event.inputs.bidi_wrap }}
          path: smoke/
          if-no-files-found: ignore

      - name: Package
        if: github.event.inputs.variant != 'vanilla'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release-fast\zed.exe" pkg\zed.exe
          @"
          Experimental Hebrew build of Zed (release channel: dev).
          Upstream commit: $env:ZED_SHA
          Run zed.exe from any folder. It uses your normal Zed settings and does not replace the installed Zed.
          "@ | Set-Content pkg\README.txt
          Compress-Archive -Path pkg\* -DestinationPath zed-hebrew-windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash zed-hebrew-windows-x64.zip -Algorithm SHA256).Hash | Set-Content zed-hebrew-windows-x64.zip.sha256
          Get-Item zed-hebrew-windows-x64.zip | Select-Object Name, Length

      - name: Publish as a GitHub release
        if: github.event.inputs.variant != 'vanilla'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag zed-hebrew-windows-x64.zip zed-hebrew-windows-x64.zip.sha256 `
            --repo "${{ github.repository }}" `
            --title "Hebrew Zed experimental build ${{ github.run_number }} (bidi_wrap=${{ github.event.inputs.bidi_wrap }})" `
            --notes "Experimental. Upstream Zed commit: $env:ZED_SHA" `
            --prerelease
